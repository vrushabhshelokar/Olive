<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Setup - Sipna Practical Attendance System</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/components.css">
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</head>
<body style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 28px 20px;">

  <div style="background-color: #ffffff; width: 100%; max-width: 520px; border-radius: var(--radius-lg); padding: 36px; box-shadow: var(--shadow-lg);">
    
    <div style="text-align: center; margin-bottom: 24px;">
      <h1 style="font-size: 1.4rem; color: var(--text-primary); margin-bottom: 4px;">Faculty Account Setup</h1>
      <p style="font-size: 0.85rem; color: var(--text-muted);">Sipna College of Engineering & Technology</p>
    </div>

    <div id="setup-error" class="alert alert-danger" style="display: none;"></div>
    <div id="setup-success" class="alert alert-success" style="display: none;"></div>

    <form id="setup-form">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
        <div class="form-group">
          <label class="form-label" for="facultyCode">Faculty Code *</label>
          <input type="text" id="facultyCode" class="form-control" placeholder="e.g. FAC003" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="name">Full Name *</label>
          <input type="text" id="name" class="form-control" placeholder="e.g. Prof. Ramesh Rao" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address *</label>
        <input type="email" id="email" class="form-control" placeholder="e.g. ramesh@sipna.ac.in" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
        <div class="form-group">
          <label class="form-label" for="department">Department *</label>
          <input type="text" id="department" class="form-control" placeholder="e.g. CSE" value="Computer Science & Engineering" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="designation">Designation *</label>
          <input type="text" id="designation" class="form-control" placeholder="e.g. Assistant Professor" value="Assistant Professor" required>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-label" for="password">Password *</label>
        <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
      </div>

      <button type="submit" id="setup-submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem;">
        Create Faculty Account
      </button>
    </form>

    <div style="margin-top: 20px; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
      Already registered? <a href="/login.html" style="font-weight: 600;">Login here</a>
    </div>

  </div>

</body>
</html>
