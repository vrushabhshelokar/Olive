<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Login - Sipna Practical Attendance System</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/components.css">
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</head>
<body style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
  
  <div style="background-color: #ffffff; width: 100%; max-width: 420px; border-radius: var(--radius-lg); padding: 36px 32px; box-shadow: var(--shadow-lg);">
    
    <div style="text-align: center; margin-bottom: 28px;">
      <div style="width: 48px; height: 48px; background-color: var(--primary-color); color: #ffffff; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; margin: 0 auto 12px auto;">
        S
      </div>
      <h1 style="font-size: 1.4rem; color: var(--text-primary); margin-bottom: 4px;">SIPNA ATTENDANCE</h1>
      <p style="font-size: 0.85rem; color: var(--text-muted);">Sipna College of Engineering & Technology</p>
      <div style="margin-top: 8px; font-weight: 600; color: var(--primary-color); font-size: 0.9rem;">Faculty Portal Login</div>
    </div>

    <div id="login-error" class="alert alert-danger" style="display: none;"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Faculty Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="e.g. abc@sipna.ac.in" required value="abc@sipna.ac.in">
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter your password" required value="Demo@123">
      </div>

      <button type="submit" id="login-submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem;">
        Login to System
      </button>
    </form>

    <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-color); text-align: center; font-size: 0.85rem; color: var(--text-muted);">
      First time user? <a href="/setup.html" style="font-weight: 600;">Create Faculty Account</a>
    </div>

    <div style="margin-top: 16px; font-size: 0.75rem; text-align: center; color: #94a3b8; background-color: #f8fafc; padding: 8px; border-radius: 6px;">
      Demo Account: <strong>abc@sipna.ac.in</strong> / Password: <strong>Demo@123</strong>
    </div>

  </div>

</body>
</html>
